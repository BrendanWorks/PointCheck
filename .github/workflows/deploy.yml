name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Deploy to production after staging validation'
        required: false
        default: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: |
          python3 -c "import ast; ast.parse(open('backend/app/main.py').read()); print('✓ main.py syntax OK')"
          python3 -c "import ast; ast.parse(open('backend/modal_app.py').read()); print('✓ modal_app.py syntax OK')"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: validate
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Deploy to staging
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal deploy --env staging backend/modal_app.py

  regression-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt 2>/dev/null || echo "No requirements.txt"
          pip install requests

      - name: Run staging regression suite
        run: python3 regression_suite.py --skip-judge --skip-axe

  deploy-prod:
    runs-on: ubuntu-latest
    needs: regression-staging
    if: github.event.inputs.deploy_prod == 'true'
    environment:
      name: production
      url: https://pointcheck.org
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Modal
        run: pip install modal

      - name: Deploy to production
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal deploy backend/modal_app.py

  regression-prod:
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt 2>/dev/null || echo "No requirements.txt"
          pip install requests

      - name: Run production regression suite
        run: python3 regression_suite.py --prod --skip-judge --skip-axe
